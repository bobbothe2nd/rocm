[package]
name = "rocm-sys"
description = "ROCm system bindings configured by release version"
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bobbothe2nd/rocm"
documentation = "https://docs.rs/crate/rocm-sys/latest"
keywords = ["gpu", "hip", "rocm", "bindings", "system"]
categories = ["hardware-support", "external-ffi-bindings"]

[dependencies]
libloading = { version = "0.9", optional = true }
rocm-include = { path = "../rocm-include", version = "0.2" }
stable_auto = { version = "0.2", optional = true }

[build-dependencies]
rocm-build = { path = "../rocm-build", version = "0.3.1" }

[features]
# configure included libraries
hip = []
hiprtc = []

hipblas = ["hip"]
hipblaslt = ["hipblas"]
hipdnn = ["hip"]
hipfft = ["hip"]
hiprand = ["hip"]
hipsolver = ["hip"]
hipsparse = ["hip"]
hipsparselt = ["hip"]
hiptensor = ["hip"]

rocalution = ["hip"]
rocblas = ["hip"]
rocfft = ["hip"]
rocrand = ["hip"]
rocsolver = ["hip"]
rocsparse = ["hip"]

miopen = ["hip"]

# link options
dynamic-loading = ["dep:libloading", "rocm-include/std"]

# include symbols that might not be in shared library
deprecated = []
internal = []

# auto trait derive
stable_auto = ["dep:stable_auto"]

[[example]]
name = "get_device_count"
required-features = ["hip", "dynamic-loading"]

[[example]]
name = "memset"
required-features = ["hip", "dynamic-loading"]

[dev-dependencies]
pastey = "0.2"
