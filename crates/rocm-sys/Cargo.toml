[package]
name = "rocm-sys"
description = "ROCm system bindings configured by release version"
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bobbothe2nd/rocm"
documentation = "https://docs.rs/crate/rocm-sys/latest"
keywords = ["gpu", "hip", "rocm", "bindings", "system"]
categories = ["hardware-support", "external-ffi-bindings"]

[dependencies]
libloading = { version = "0.9", optional = true }

[build-dependencies]
rocm-build = { path = "../rocm-build", version = "0.1" }

[features]
default = ["rocblas", "dynamic-loading", "hiprtc"]

# configure included libraries
hip = []
hiprtc = []

hipblas = ["hip"]
hipblaslt = ["hip"]
hipcub = ["hip"]
hipdnn = ["hip"]
hipfft = ["hip"]
hiprand = ["hip"]
hipsolver = ["hip"]
hipsparse = ["hip"]
hipsparselt = ["hip"]
hiptensor = ["hip"]
hipthreads = ["hip"]

rocalution = ["hip"]
rocblas = ["hip"]
rocfft = ["hip"]
rocprim = ["hip"]
rocrand = ["hip"]
rocsolver = ["hip"]
rocsparse = ["hip"]
rocthrust = ["hip"]
rocwmma = ["hip"]

# link options
dynamic-loading = ["dep:libloading"]

# include symbols that might not be in shared library
deprecated = []
internal = []

[[example]]
name = "get_device_count"
required-features = ["hip", "dynamic-loading"]

[[example]]
name = "memset"
required-features = ["hip", "dynamic-loading"]
