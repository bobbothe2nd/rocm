[package]
name = "rocm-rt"
description = "ROCm abstraction runtime core"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bobbothe2nd/rocm"
documentation = "https://docs.rs/crate/rocm-rt/latest"
keywords = ["gpu", "hip", "rocm", "rocfft", "rocblas"]
categories = ["hardware-support"]

[dependencies]
rocm-sys = { path = "../rocm-sys", version = "0.2.0" }

[build-dependencies]
rocm-build = { path = "../rocm-build", version = "0.1.2" }

[features]
default = ["hip", "hiprtc", "dynamic-loading"]

hip = ["rocm-sys/hip"]
hiprtc = ["rocm-sys/hiprtc"]
hipblas = ["rocm-sys/hipblas"]
hipblaslt = ["rocm-sys/hipblaslt"]
hipcub = ["rocm-sys/hipcub"]
hipdnn = ["rocm-sys/hipdnn"]
hipfft = ["rocm-sys/hipfft"]
hiprand = ["rocm-sys/hiprand"]
hipsolver = ["rocm-sys/hipsolver"]
hipsparse = ["rocm-sys/hipsparse"]
hipsparselt = ["rocm-sys/hipsparselt"]
hiptensor = ["rocm-sys/hiptensor"]
hipthreads = ["rocm-sys/hipthreads"]
rocalution = ["rocm-sys/rocalution"]
rocblas = ["rocm-sys/rocblas"]
rocfft = ["rocm-sys/rocfft"]
rocprim = ["rocm-sys/rocprim"]
rocrand = ["rocm-sys/rocrand"]
rocsolver = ["rocm-sys/rocsolver"]
rocsparse = ["rocm-sys/rocsparse"]
rocthrust = ["rocm-sys/rocthrust"]
rocwmma = ["rocm-sys/rocwmma"]

dynamic-loading = ["rocm-sys/dynamic-loading"]
