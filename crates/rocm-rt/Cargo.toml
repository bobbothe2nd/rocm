[package]
name = "rocm-rt"
description = "ROCm abstraction runtime core"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bobbothe2nd/rocm"
documentation = "https://docs.rs/crate/rocm-rt/latest"
keywords = ["gpu", "hip", "rocm", "rocfft", "rocblas"]
categories = ["hardware-support"]

[dependencies]
bitflags = "2"
log = { version = "0.4", optional = true }
rocm-sys = { path = "../rocm-sys", version = "0.5" }

[build-dependencies]
rocm-build = { path = "../rocm-build", version = "0.1" }

[features]
hip = ["rocm-sys/hip"]
hiprtc = ["rocm-sys/hiprtc"]
hipblas = ["rocm-sys/hipblas", "hip"]
hipblaslt = ["rocm-sys/hipblaslt", "hipblas"]
hipcub = ["rocm-sys/hipcub", "hip"]
hipdnn = ["rocm-sys/hipdnn", "hip"]
hipfft = ["rocm-sys/hipfft", "hip"]
hiprand = ["rocm-sys/hiprand", "hip"]
hipsolver = ["rocm-sys/hipsolver", "hip"]
hipsparse = ["rocm-sys/hipsparse", "hip"]
hipsparselt = ["rocm-sys/hipsparselt", "hip"]
hiptensor = ["rocm-sys/hiptensor", "hip"]
hipthreads = ["rocm-sys/hipthreads", "hip"]
rocalution = ["rocm-sys/rocalution", "hip"]
rocblas = ["rocm-sys/rocblas", "hip"]
rocfft = ["rocm-sys/rocfft", "hip"]
rocprim = ["rocm-sys/rocprim", "hip"]
rocrand = ["rocm-sys/rocrand", "hip"]
rocsolver = ["rocm-sys/rocsolver", "hip"]
rocsparse = ["rocm-sys/rocsparse", "hip"]
rocthrust = ["rocm-sys/rocthrust", "hip"]
rocwmma = ["rocm-sys/rocwmma", "hip"]

dynamic-loading = ["rocm-sys/dynamic-loading"]

std = []
log = ["dep:log"]

[[example]]
name = "kernel_launch"
required-features = [
    "hip",
    "hiprtc",
]

[[example]]
name = "graph_launch"
required-features = [
    "hip",
    "hiprtc",
]

[[example]]
name = "capture_graph"
required-features = [
    "hip",
    "hiprtc",
]

[[test]]
name = "copy"
required-features = ["hip", "dynamic-loading"]
