[package]
name = "roc"
description = "ROCm abstraction runtime core"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bobbothe2nd/rocm"
documentation = "https://docs.rs/crate/roc/latest"
keywords = ["gpu", "hip", "rocm", "rocfft", "rocblas"]
categories = ["hardware-support"]

[dependencies]
bitflags = "2"
log = { version = "0.4", optional = true }
rocm-sys = { path = "../rocm-sys", version = "0.7" }
rocm-include = { path = "../rocm-include", version = "0.2" }
stable_auto = { version = "0.2", optional = true }

[build-dependencies]
rocm-build = { path = "../rocm-build", version = "0.3.1" }

[features]
default = ["dynamic-loading", "hip"]

# ROCm libraries
hip = ["rocm-sys/hip"]
hiprtc = ["rocm-sys/hiprtc"]

hipblas = ["rocm-sys/hipblas", "hip", "blas"]
hipblaslt = ["rocm-sys/hipblaslt", "hipblas"]
hipdnn = ["rocm-sys/hipdnn", "hip"]
hipfft = ["rocm-sys/hipfft", "hip", "fft"]
hiprand = ["rocm-sys/hiprand", "hip"]
hipsolver = ["rocm-sys/hipsolver", "hip"]
hipsparse = ["rocm-sys/hipsparse", "hip"]
hipsparselt = ["rocm-sys/hipsparselt", "hip"]
hiptensor = ["rocm-sys/hiptensor", "hip"]

rocalution = ["rocm-sys/rocalution", "hip"]
rocblas = ["rocm-sys/rocblas", "hip", "blas"]
rocfft = ["rocm-sys/rocfft", "hip", "fft"]
rocrand = ["rocm-sys/rocrand", "hip"]
rocsolver = ["rocm-sys/rocsolver", "hip"]
rocsparse = ["rocm-sys/rocsparse", "hip"]

miopen = ["rocm-sys/miopen", "hip"]

# internal libraries
blas = []
fft = []

# internal crate features
dynamic-loading = ["rocm-sys/dynamic-loading", "std"]

# external libraries
std = ["rocm-include/std"]
log = ["dep:log"]
stable_auto = ["rocm-sys/stable_auto", "dep:stable_auto"]

[[example]]
name = "kernel_launch"
required-features = [
    "hip",
    "hiprtc",
]

[[example]]
name = "graph_launch"
required-features = [
    "hip",
    "hiprtc",
]

[[example]]
name = "capture_graph"
required-features = [
    "hip",
    "hiprtc",
]

[[test]]
name = "copy"
required-features = ["hip", "dynamic-loading"]
